[package]
name = "quota-lite"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Offline personal usage budget tracker for local coding assistant logs"
readme = "README.md"
repository = "https://github.com/papayuh/quota-lite"
homepage = "https://github.com/papayuh/quota-lite"
keywords = ["claude", "usage", "budget", "offline", "cli"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/*.rs", "tests/fixtures/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
